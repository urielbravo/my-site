<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="A green DOS terminal screen showing retro boot text">
    <rect width="800" height="450" fill="#000" />
    <rect x="18" y="18" width="764" height="414" fill="none" stroke="#00ff00" stroke-width="3" />
    <rect x="18" y="18" width="764" height="38" fill="#00ff00" />

    <text x="38" y="45" font-family="monospace" font-size="20" fill="#000">C:\RETRO\GUESTBOOK.TXT</text>

    <g font-family="monospace" font-size="19" fill="#00ff00">
        <text x="44" y="100">&gt; boot retro_theme.exe</text>
        <text x="44" y="132">Loading fonts ......... done</text>
        <text x="44" y="164">Loading gifs .......... done</text>
        <text x="44" y="196">Blinding colors ....... ON</text>
        <text x="44" y="228">Background music ..... MIDI</text>
        <text x="44" y="276">READY.</text>
    </g>

    <rect x="44" y="292" width="12" height="22" fill="#00ff00" />
    <g font-family="monospace" font-size="17" fill="#00ff00" opacity="0.75">
        <text x="44" y="350">Best viewed in Netscape Navigator</text>
        <text x="44" y="380">at 800x600 resolution.</text>
    </g>
</svg>